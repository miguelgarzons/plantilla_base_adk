name: adk_helpdesk_project_builder_v2
version: 2.0.0
language: es
description: >
  Skill para construir, refactorizar o migrar proyectos ADK de forma industrial,
  incluyendo blueprint de arquitectura, plan de codigo por archivos y checklist
  operativo para despliegue.
owners:
  - equipo_mesa_ayuda

input_schema:
  type: object
  required:
    - objective
    - operation_mode
    - target_stack
  properties:
    objective:
      type: string
    operation_mode:
      type: string
      enum: [scaffold, refactor, migrate, harden, codegen]
    target_stack:
      type: string
    domain:
      type: string
    app_name:
      type: string
    external_systems:
      type: array
      items: { type: string }
    constraints:
      type: array
      items: { type: string }
    environments:
      type: array
      items: { type: string }
    non_functional_requirements:
      type: array
      items: { type: string }

output_contract:
  type: object
  required:
    - architecture
    - folder_structure
    - implementation_plan
    - file_plan
    - acceptance_checks
  properties:
    architecture:
      type: string
    folder_structure:
      type: string
    implementation_plan:
      type: string
    file_plan:
      type: string
      description: Lista concreta de archivos a crear/modificar por fase.
    acceptance_checks:
      type: string
      description: Criterios verificables para aceptar la implementacion.
    validation_plan:
      type: string
    runbook:
      type: string

rules:
  - Usar root_agent con SequentialAgent y subagentes por responsabilidad.
  - Mantener side-effects en tools, no en prompts largos del LLM.
  - Definir idempotencia para evitar duplicados en side-effects.
  - Definir logs estructurados por etapa y por tool.
  - Incluir reintentos/fallback para modelo y APIs externas.
  - Separar plantillas de correo/reportes en archivos dedicados.
  - Documentar diferencias local vs produccion.
  - Entregar plan por fases con hitos y validaciones.

anti_patterns:
  - Un solo agente monolitico para toda la logica.
  - Texto generico sin contratos de entrada/salida.
  - Falta de plan de pruebas y observabilidad.
  - Hardcodear secretos o configuracion sensible en codigo.

reference_architecture:
  root_agent: SequentialAgent
  flow:
    - receptor_ingesta
    - clasificador
    - subagentes_condicionales
    - cierre_confirmacion
  layers:
    - subagents
    - tools
    - integrations/mcp
    - templates
    - config

model_profiles:
  gemini:
    temperature: 0.35
    top_p: 0.9
    max_output_tokens: 1200
  gpt:
    temperature: 0.3
    top_p: 0.9
    max_output_tokens: 1200
  claude:
    temperature: 0.3
    max_tokens: 1200
  llama:
    temperature: 0.35
    top_p: 0.9
    max_tokens: 1400
